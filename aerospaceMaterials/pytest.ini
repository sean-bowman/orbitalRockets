[pytest]
testpaths = tests
# fluidSystems uses camelCase file and function names, so the default test_*.py
# discovery pattern would match nothing.
python_files = test*.py
# Class collection is disabled: every test here is a module-level function, and the Test* pattern
# would otherwise try to collect domain classes named TestCampaign, TestInfeasibleError and so on.
python_classes =
python_functions = test*
