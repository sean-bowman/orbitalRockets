[pytest]
# Every domain keeps its own tests/ directory. Listing them explicitly rather than relying on
# rootdir discovery keeps the run deterministic as domains are added.
testpaths =
    common/tests
    fluidSystems/tests
    fluidSystems/fluidSystemsTesting/tests
    aerospaceStructures/tests
    propulsion/tests
    propulsion/combustionDevices/tests
    propulsion/turbomachinery/tests
    propulsion/engineCycles/tests
    propulsion/nozzles/tests
    propulsion/ignitionAndStart/tests
    propulsion/propulsionTesting/tests
    aerospaceMaterials/tests
    aerospaceMaterials/additiveLPBF/tests
    aerospaceMaterials/spinCasting/tests
    aerospaceMaterials/castingProcesses/tests
    aerospaceMaterials/formingProcesses/tests
    aerospaceMaterials/machiningProcesses/tests
    aerospaceMaterials/postProcessing/tests
    aerospaceMaterials/extrusionHoning/tests
    thermalManagement/tests
    environmentsAndLoads/tests
    vehicleArchitecture/tests
    mechanismsAndSeparation/tests
    electricalPower/tests
    recoveryAndReusability/tests
    reliabilityAndMissionAssurance/tests

# orbitalRockets uses camelCase file and function names, so the default test_*.py discovery pattern
# would match nothing.
python_files = test*.py
# Class collection is disabled: every test here is a module-level function, and the Test* pattern
# would otherwise try to collect domain classes named TestCampaign, TestInfeasibleError and so on.
python_classes =
python_functions = test*
